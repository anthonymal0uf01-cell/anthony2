name: Phase 2 AU Detector Train
on:
  workflow_dispatch:
  push:
    paths:
      - 'site-gate-tracker/specialist/export_hf_plate_detection_yolo.py'
      - 'site-gate-tracker/specialist/export_tlpd_yolo.py'
      - 'site-gate-tracker/specialist/build_au_camera_plate_composites.py'
      - 'site-gate-tracker/specialist/phase2_train_au_plate_detector.py'
      - 'site-gate-tracker/specialist/phase2_build_au_vehicle_profile.py'
      - '.github/workflows/phase2-au-detector-train.yml'
concurrency:
  group: phase2-au-detector
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install detector stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install ultralytics datasets pillow onnx
      - name: Export CC-BY Hugging Face plate boxes
        run: |
          python site-gate-tracker/specialist/export_hf_plate_detection_yolo.py --out /tmp/hf_plate --limit 6176
      - name: Build Australian road-domain detector set
        run: |
          python site-gate-tracker/specialist/build_au_camera_plate_composites.py --out /tmp/au_plate --count 3500 --ocr-min-width 20 --ocr-min-height 6 --tiny-max-width 64 --tiny-focus-ratio 0.80
      - name: Build live Australian vehicle profile
        run: |
          python site-gate-tracker/specialist/phase2_build_au_vehicle_profile.py --out /tmp/phase2_detector/au_vehicle_profile.json --limit 100
      - name: Train generic to Australian detector
        run: |
          python site-gate-tracker/specialist/phase2_train_au_plate_detector.py --hf /tmp/hf_plate --au /tmp/au_plate --out /tmp/phase2_detector --model site-gate-tracker/specialist/weights/au_plate_detector.pt --baseline site-gate-tracker/specialist/weights/au_plate_detector.pt --warmup-epochs 0 --au-epochs 3 --warmup-imgsz 384 --au-imgsz 640 --warmup-batch 24 --au-batch 12 --min-map50 0.60 --min-recall 0.60 --tiny-max-width 64 --min-tiny-recall 0.35 --min-tiny-improvement 0.005
      - name: Publish detector checkpoint
        run: |
          mkdir -p site-gate-tracker/specialist/weights
          cp /tmp/phase2_detector/au_plate_detector.pt site-gate-tracker/specialist/weights/
          test -f /tmp/phase2_detector/au_plate_detector.onnx && cp /tmp/phase2_detector/au_plate_detector.onnx site-gate-tracker/specialist/weights/ || true
          cp /tmp/phase2_detector/au_plate_detector.metrics.json site-gate-tracker/specialist/weights/
          cp /tmp/phase2_detector/au_vehicle_profile.json site-gate-tracker/specialist/weights/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add site-gate-tracker/specialist/weights/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Train Phase 2 Australian plate detector"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-au-detector
          path: /tmp/phase2_detector/
          retention-days: 30
