name: Phase 2 TLPD Source Check
on:
  push:
    paths:
      - 'site-gate-tracker/specialist/export_tlpd_yolo.py'
      - '.github/workflows/phase2-tlpd-source.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install datasets pillow
      - name: Export TLPD and verify YOLO labels
        continue-on-error: true
        run: |
          python site-gate-tracker/specialist/export_tlpd_yolo.py --out /tmp/tlpd || exit 0
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/tlpd')
          counts={}
          boxes=0
          for s in ('train','val','test'):
              ims=list((root/s/'images').glob('*'))
              labs=list((root/s/'labels').glob('*.txt'))
              counts[s]={'images':len(ims),'labels':len(labs)}
              for p in labs:
                  boxes+=sum(1 for x in p.read_text().splitlines() if x.strip())
          print(json.dumps({'splits':counts,'boxes':boxes},indent=2))
          if counts['train']['images']<1900 or counts['val']['images']<200 or counts['test']['images']<200 or boxes<2400:
              raise SystemExit('TLPD source gate failed')
          PY
