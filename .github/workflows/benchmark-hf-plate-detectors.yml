name: Benchmark HF Plate Detectors

on:
  workflow_dispatch:
  push:
    paths:
      - 'site-gate-tracker/specialist/benchmark_hf_plate_detectors.py'
      - '.github/workflows/benchmark-hf-plate-detectors.yml'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install ultralytics transformers huggingface_hub pillow safetensors

      - name: Download exact 44-crop live failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/street
          gh api repos/${{ github.repository }}/actions/artifacts/10689663821/zip > /tmp/street.zip
          unzip -q /tmp/street.zip -d /tmp/street
          test -d /tmp/street/crops/vehicles
          echo "Crops: $(find /tmp/street/crops/vehicles -type f -name '*.jpg' | wc -l)"

      - name: Benchmark detectors
        run: |
          python site-gate-tracker/specialist/benchmark_hf_plate_detectors.py \
            --crops /tmp/street/crops/vehicles \
            --out /tmp/hf-benchmark \
            --limit 60
          cat /tmp/hf-benchmark/summary.json

      - name: Publish benchmark status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          s=json.load(open("/tmp/hf-benchmark/summary.json"))
          best=max(s.items(), key=lambda kv:(kv[1]["images_with_box"],kv[1]["mean_conf"]))
          desc=f"best={best[0]} crops={best[1]['images_with_box']}/{best[1]['images']} boxes={best[1]['boxes']}"
          body=json.dumps({"state":"success","context":"hf-plate-benchmark","description":desc[:140]}).encode()
          url="https://api.github.com/repos/"+os.environ["REPO"]+"/statuses/"+os.environ["SHA"]
          req=urllib.request.Request(url,data=body,method="POST",headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json",
            "Content-Type":"application/json",
            "User-Agent":"anthony2-hf-benchmark"
          })
          urllib.request.urlopen(req,timeout=20).read()
          print(desc)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hf-plate-detector-benchmark
          path: /tmp/hf-benchmark/
          retention-days: 7
