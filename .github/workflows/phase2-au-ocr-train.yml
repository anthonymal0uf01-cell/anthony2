name: Phase 2 AU OCR Train
on:
  workflow_dispatch:
  push:
    paths:
      - 'site-gate-tracker/specialist/phase2_train_au_ocr.py'
      - 'site-gate-tracker/specialist/generate_au_synthetic_plates.py'
      - 'site-gate-tracker/specialist/build_au_camera_plate_composites.py'
      - '.github/workflows/phase2-au-ocr-train.yml'
concurrency:
  group: phase2-au-ocr
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pillow numpy onnx ultralytics
      - name: Generate Australian OCR curriculum
        run: |
          python site-gate-tracker/specialist/generate_au_synthetic_plates.py --count 75000 --seed 260918 --out /tmp/au_synth
      - name: Build Australian camera-domain OCR adaptation set
        run: |
          python site-gate-tracker/specialist/build_au_camera_plate_composites.py --out /tmp/au_camera --count 6000 --seed 260919 --ocr-min-width 64 --ocr-min-height 18 --require-ocr
      - name: Train and validate checkpoint
        run: |
          python site-gate-tracker/specialist/phase2_train_au_ocr.py /tmp/au_synth --epochs 10 --batch 96 --min-exact 0.95 --min-hard-slice 0.90 --adapt-dataset /tmp/au_camera/ocr --adapt-epochs 8 --adapt-synth-ratio 1.5 --adapt-lr-mult 0.06 --min-adapt-exact 0.80 --out /tmp/phase2_weights
      - name: Publish real trained weights
        run: |
          mkdir -p site-gate-tracker/specialist/weights
          cp /tmp/phase2_weights/au_ocr_seed.pt site-gate-tracker/specialist/weights/
          test -f /tmp/phase2_weights/au_ocr_seed.onnx && cp /tmp/phase2_weights/au_ocr_seed.onnx site-gate-tracker/specialist/weights/ || true
          cp /tmp/phase2_weights/metrics.json site-gate-tracker/specialist/weights/au_ocr_seed.metrics.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add site-gate-tracker/specialist/weights/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Train Phase 2 Australian OCR seed"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-au-ocr-weights
          path: /tmp/phase2_weights/
          retention-days: 30
